name: tests

on:
  push:
  pull_request:

jobs:
  windows:
    # тесты рассчитаны на Windows PowerShell 5.1 — тот же, что у пользователей
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка (проверка синтаксиса, BOM и JSON)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1

      - name: Тесты движка
        shell: powershell
        run: |
          $failed = @()
          foreach ($t in Get-ChildItem -Path .\tests -Filter *.Tests.ps1) {
            Write-Host "===== $($t.Name)"
            powershell -NoProfile -ExecutionPolicy Bypass -File $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed.Count) { Write-Host ("Упали: " + ($failed -join ', ')); exit 1 }

      - name: Собранный файл
        uses: actions/upload-artifact@v4
        with:
          name: pckit-by-odilbek
          path: dist/

  portable:
    # тесты отката и защиты профиля не зависят от Windows — быстрый прогон в PowerShell 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Undo.Tests (PowerShell 7)
        shell: pwsh
        run: ./tests/Undo.Tests.ps1
